[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "costzera"
version = "0.1.0"
description = "Find and fix what makes AI agents slow and expensive. Prompts and completions never leave your process."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Costzera" }]
keywords = ["llm", "agents", "observability", "cost", "opentelemetry", "openinference"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
openai = ["openinference-instrumentation-openai"]
anthropic = ["openinference-instrumentation-anthropic"]
langchain = ["openinference-instrumentation-langchain"]
llama-index = ["openinference-instrumentation-llama-index"]
litellm = ["openinference-instrumentation-litellm"]
crewai = ["openinference-instrumentation-crewai"]
bedrock = ["openinference-instrumentation-bedrock"]
openai-agents = ["openinference-instrumentation-openai-agents"]
dspy = ["openinference-instrumentation-dspy"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://costzera.com"
Documentation = "https://costzera.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/costzera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
